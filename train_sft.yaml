### model
model_name_or_path: /data/zenghaoyang/models/Qwen/Qwen/Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
quantization_bit: 4

### dataset
dataset: table_agent_sft
template: qwen3
dataset_dir: /data/zenghaoyang/TableAgentBench/llamafactory_data
cutoff_len: 16384
preprocessing_num_workers: 4
overwrite_cache: true

### memory optimization
gradient_checkpointing: true

### output
output_dir: /data/zenghaoyang/TableAgentBench/output/sft_lora
logging_steps: 1
save_steps: 5
plot_loss: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 10
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
dataloader_num_workers: 2

### eval (no separate eval set, use training data for eval)
do_eval: false
